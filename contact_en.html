    <!-- Contenu principal -->

    <main>
      <h1>Contact me</h1>

      <section class="contact-info">
        <h2>Contact information</h2>
        <ul>
          <li>
            <strong>Email :</strong>
            <a href="mailto:portfolio.baranger@free.fr"
              >portfolio.baranger@free.fr</a
            >
          </li>
          <li>
            <strong>Phone :</strong>
            <a href="tel:+33768674526">+33 7 68 67 45 26</a>
          </li>
          <li><strong>Localisation :</strong> Calais / Indre / France</li>
        </ul>
      </section>

      <form class="contact-form" onsubmit="sendMail(event)">
        <div class="form-row">
          <div class="form-group">
            <label for="nom">Name</label>
            <input
              type="text"
              id="nom"
              name="nom"
              placeholder="Your name"
              required
            />
          </div>

          <div class="form-group">
            <label for="prenom">First name</label>
            <input
              type="text"
              id="prenom"
              name="prenom"
              placeholder="Your first name"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label for="email">Email address</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Your email"
            required
          />
        </div>

        <div class="form-group">
          <label for="sujet">Subject</label>
          <input
            type="text"
            id="sujet"
            name="sujet"
            placeholder="Subject of the message"
            required
          />
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea
            id="message"
            name="message"
            placeholder="Your message..."
            required
          ></textarea>
        </div>

        <button type="submit" class="btn-submit">Send</button>
      </form>
    </main>

    <a href="#top" id="backtop" class="backtop">↑</a>

    <footer>
      <div class="footer-content">

                alt="GitLab logo"
              />

            <a

              target="_blank"
              aria-label="LinkedIn"
            >
              <img
                src="img/logo_linkedin_nb.svg"

                alt="LinkeIn logo"
              />

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <script>
      emailjs.init({
        publicKey: "4vl85eClIkiojkt2q",
      });
    </script>

    <script>
      function sendMail(event) {
        event.preventDefault();

        const params = {
          nom: document.getElementById("nom").value,
          prenom: document.getElementById("prenom").value,
          email: document.getElementById("email").value,
          sujet: document.getElementById("sujet").value,
          message: document.getElementById("message").value,
        };

        emailjs
          .send("service_591h7rq", "template_i20az6v", params)
          .then(() => {
            alert("Your message has been successfully sent !");
            document.querySelector(".contact-form").reset();
          })
          .catch((error) => {
            alert("Error : " + JSON.stringify(error));
          });
      }
    </script>
    <script src="/js/modale.js"></script>
